# data-collector 采集工作流
# 每30分钟运行一次，采集 GitHub Trending 和 ECC 更新

name: Data Collection

on:
  schedule:
    # 每30分钟运行一次（UTC时间）
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml

      - name: 创建暂存区目录
        run: mkdir -p staging

      - name: 采集 GitHub Trending
        run: python scripts/collect_github.py
        continue-on-error: true

      - name: 采集 ECC 更新
        run: python scripts/collect_ecc.py
        continue-on-error: true

      - name: 分级筛选（L1/L2/L3）
        run: python scripts/classify.py
        continue-on-error: true

      - name: 数据签名
        run: python scripts/sign.py
        continue-on-error: true

      - name: 安全检查
        run: python scripts/security_check.py
        continue-on-error: true

      - name: 清理过期文件
        run: python scripts/cleanup.py
        continue-on-error: true

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: collected-data
          path: staging/*.json
          retention-days: 7
