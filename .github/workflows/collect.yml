# data-collector 采集工作流
# 定时采集 GitHub 公开数据，供 V 系统私密库拉取使用

name: Data Collection

on:
  # ============================================================
  # 定时触发：北京时间每天 4 次
  #   08:00, 14:00, 20:00, 02:00（UTC+8）
  #   对应 UTC: 00:00, 06:00, 12:00, 18:00
  # ============================================================
  schedule:
    - cron: '0 0,6,12,18 * * *'

  # ============================================================
  # 手动触发：允许在 Actions 页面点击 "Run workflow"
  # ============================================================
  workflow_dispatch:

# ============================================================
# 权限配置
# ============================================================
permissions:
  contents: read
  actions: write

# ============================================================
# 环境变量
# ============================================================
env:
  TZ: Asia/Shanghai

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml

      - name: 创建暂存区目录
        run: mkdir -p staging

      - name: 采集 GitHub Trending
        run: python scripts/collect_github.py
        continue-on-error: true

      - name: 采集 GitHub 搜索（量化/金融项目）
        run: python scripts/collect_ecc.py
        continue-on-error: true

      - name: 分级筛选（L1/L2/L3）
        run: python scripts/classify.py
        continue-on-error: true

      - name: 数据签名
        run: python scripts/sign.py
        continue-on-error: true

      - name: 安全检查
        run: python scripts/security_check.py
        continue-on-error: true

      - name: 清理过期文件
        run: python scripts/cleanup.py
        continue-on-error: true

      - name: 打印分级统计
        run: |
          echo "📊 最新分级结果:"
          ls -la staging/ | grep classified
          echo ""
          echo "📦 暂存区文件列表:"
          ls -la staging/

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: collected-data
          path: staging/*.json
          retention-days: 7

      - name: 完成通知（日志）
        run: |
          echo "✅ 采集完成时间: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "📊 暂存区文件数: $(ls -1 staging/*.json 2>/dev/null | wc -l)"
