name: P1 爬虫验证

on:
  push:
    paths:
      - 'scrapers/**'
      - 'collect_*.py'
  workflow_dispatch:

jobs:
  test-scrapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install beautifulsoup4 lxml

      - name: 语法检查
        run: |
          python -m py_compile scrapers/*.py
          echo "✅ 语法检查通过"

      - name: 导入测试
        run: |
          python -c "from scrapers import scrape_commodities, scrape_macro, scrape_sectors; print('✅ 导入成功')"

      - name: 测试大宗商品爬虫
        run: |
          python -c "
          from scrapers.commodity_scraper import scrape_commodities
          result = scrape_commodities()
          assert result and result.get('items'), '无数据返回'
          print(f'✅ 大宗商品爬虫: {len(result[\"items\"])} 项')
          "

      - name: 测试宏观数据爬虫
        run: |
          python -c "
          from scrapers.macro_scraper import scrape_macro
          result = scrape_macro()
          assert result and result.get('items'), '无数据返回'
          print(f'✅ 宏观数据爬虫: {len(result[\"items\"])} 项')
          "

      - name: 测试板块数据爬虫
        run: |
          python -c "
          from scrapers.sector_scraper import scrape_sectors
          result = scrape_sectors()
          assert result and result.get('items'), '无数据返回'
          print(f'✅ 板块数据爬虫: {len(result[\"items\"])} 项')
          "

      - name: 最终报告
        run: |
          echo "## ✅ P1 爬虫验证全部通过" >> $GITHUB_STEP_SUMMARY
