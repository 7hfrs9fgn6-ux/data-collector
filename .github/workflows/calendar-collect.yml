# data-collector 万年历采集工作流（知识库模式）
# 采集：A股/港股/美股交易日、节假日、DST 信息
# 策略：首次全量采集，后续仅增量补充缺失年份
# 触发：每年1月1日执行 + 手动触发

name: 📅 万年历知识库采集

on:
  schedule:
    - cron: '0 0 1 1 *'              # 每年1月1日 00:00 执行
  workflow_dispatch:                  # 支持手动触发

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

jobs:
  collect-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: 📅 采集万年历知识库

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests pyyaml pytz

      - name: 📁 创建知识库目录
        run: mkdir -p knowledge_library/calendar/checkpoints

      - name: 📅 采集万年历数据（增量模式）
        run: python scripts/collect_calendar.py
        continue-on-error: true

      - name: 📦 打包当日状态（供私密库快速查询）
        run: python scripts/pack_calendar.py
        continue-on-error: true

      - name: 📋 打印知识库状态
        run: |
          echo "📂 知识库目录:"
          ls -la knowledge_library/calendar/ || echo "   (目录不存在)"
          echo ""
          echo "📊 数据统计:"
          if [ -f knowledge_library/calendar/calendar_knowledge.jsonl ]; then
            echo "   - 条目数: $(wc -l < knowledge_library/calendar/calendar_knowledge.jsonl)"
            echo "   - 文件大小: $(du -h knowledge_library/calendar/calendar_knowledge.jsonl | cut -f1)"
          else
            echo "   - 暂无数据"
          fi
          echo ""
          if [ -f knowledge_library/calendar/meta.json ]; then
            echo "📋 元数据:"
            cat knowledge_library/calendar/meta.json
          else
            echo "   - 暂无元数据"
          fi

      - name: 📤 上传 Artifact（当日状态包）
        uses: actions/upload-artifact@v4
        with:
          name: calendar-status-data
          path: staging/calendar_status_package_*.json
          retention-days: 7

      - name: ✅ 采集完成
        if: success()
        run: |
          echo "✅ 万年历知识库采集完成"
          echo "   📅 数据已写入: knowledge_library/calendar/"
          echo "   📦 状态包已生成: staging/calendar_status_package_*.json"
          echo "   🕐 下次自动执行: 明年1月1日 00:00"
