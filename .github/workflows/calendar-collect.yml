# data-collector 万年历采集工作流
# 采集：A股/港股/美股交易日、节假日、冬令时/夏令时信息
# 频率：每日 08:00（北京时间）
# 输出：calendar_package_*.json（统一格式数据包）

name: 📅 万年历采集

on:
  schedule:
    - cron: '0 8 * * *'              # 每日 08:00 执行
  workflow_dispatch:                  # 支持手动触发

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

jobs:
  collect-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: 📅 采集万年历数据

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests pyyaml pytz

      - name: 📁 创建暂存区目录
        run: mkdir -p staging

      - name: 📅 采集万年历数据
        run: python scripts/collect_calendar.py
        continue-on-error: true

      - name: 🔏 数据签名
        run: python scripts/sign.py
        continue-on-error: true

      - name: 📦 打包万年历数据
        run: python scripts/pack_calendar.py
        continue-on-error: true

      - name: 📋 打印暂存区状态
        run: |
          echo "📦 万年历数据文件列表:"
          ls -la staging/ | grep -E "calendar" || echo "   (暂无文件)"
          echo ""
          echo "📊 文件统计:"
          echo "   - 原始文件: $(ls staging/ | grep -E 'calendar_raw.*\.json' | wc -l)"
          echo "   - 打包文件: $(ls staging/ | grep -E 'calendar_package_.*\.json' | wc -l)"

      - name: 📤 上传 Artifact（万年历打包数据）
        uses: actions/upload-artifact@v4
        with:
          name: calendar-data
          path: staging/calendar_package_*.json
          retention-days: 7

      - name: ✅ 采集完成
        if: success()
        run: |
          echo "✅ 万年历采集完成"
          echo "   📅 包含: A股/港股/美股 交易日、节假日、DST 信息"
          echo "   🕐 采集时间: 08:00"
          echo "   📦 数据包格式: 统一格式（含 trade_date/is_trading_day/dst_active）"
