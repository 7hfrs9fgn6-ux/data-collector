# data-collector 万年历采集工作流（知识库版）
# 采集 A股/港股/美股 交易日、节假日、DST 信息
# 策略：一次性采集 1990-2030 年，存入知识库记忆体
# 触发：手动触发为主，每年 1 月 1 日自动增量（补上一年数据）

name: 📅 万年历采集（知识库）

on:
  schedule:
    - cron: '0 0 1 1 *'              # 每年 1 月 1 日 00:00（增量更新）
  workflow_dispatch:                  # 支持手动触发
    inputs:
      start_year:
        description: '起始年份'
        required: false
        default: '1990'
        type: string
      end_year:
        description: '结束年份'
        required: false
        default: '2030'
        type: string

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

jobs:
  collect-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: 📅 采集万年历数据

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests pyyaml pytz

      - name: 📁 创建暂存区目录
        run: mkdir -p staging

      - name: 📅 采集万年历数据
        run: |
          if [ -n "${{ inputs.start_year }}" ] && [ -n "${{ inputs.end_year }}" ]; then
            python scripts/collect_calendar.py --start-year ${{ inputs.start_year }} --end-year ${{ inputs.end_year }}
          else
            python scripts/collect_calendar.py
          fi
        continue-on-error: true

      - name: 📋 打印暂存区状态
        run: |
          echo "📦 万年历文件列表:"
          ls -la staging/ | grep -E "calendar" || echo "   (暂无文件)"
          echo ""
          echo "📊 文件统计:"
          echo "   - 原始文件: $(ls staging/ | grep -E 'calendar_raw_.*\.json' | wc -l)"
          echo "   - 打包文件: $(ls staging/ | grep -E 'calendar_package_.*\.json' | wc -l)"

      - name: 📤 上传 Artifact（万年历打包数据）
        uses: actions/upload-artifact@v4
        with:
          name: calendar-data
          path: staging/calendar_package_*.json
          retention-days: 30

      - name: ✅ 采集完成
        if: success()
        run: |
          echo "✅ 万年历采集完成"
          echo "   📅 数据范围: 1990-2030（可增量更新）"
          echo "   📦 数据包格式: 统一格式（含 trade_date/is_trading_day/dst_active）"
          echo "   🏷️  类型: 知识库数据（静态知识）"
