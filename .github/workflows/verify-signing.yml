name: Verify SIGNING_KEY

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 验证 SIGNING_KEY 签名
        run: |
          python -c "
          import os
          import json
          import hmac
          import hashlib

          key = os.environ.get('SIGNING_KEY', '')
          if not key:
              print('❌ SIGNING_KEY 未配置')
              exit(1)
          
          print(f'✅ SIGNING_KEY 已配置 (长度: {len(key)} 字符)')
          print(f'🔑 密钥前缀: {key[:8]}...{key[-8:]}')

          # 创建测试数据
          test_data = {'test': 'data', 'timestamp': '2026-08-14'}
          content = json.dumps(test_data, sort_keys=True)

          # 生成签名
          signature = hmac.new(
              key.encode('utf-8'),
              content.encode('utf-8'),
              hashlib.sha256
          ).hexdigest()

          print(f'🔐 测试签名: {signature[:16]}...')

          # 验证签名
          expected = hmac.new(
              key.encode('utf-8'),
              content.encode('utf-8'),
              hashlib.sha256
          ).hexdigest()

          if signature == expected:
              print('✅ 签名验证通过 (HMAC-SHA256)')
          else:
              print('❌ 签名验证失败')
              exit(1)

          print('✅ 验证完成')
          "
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
