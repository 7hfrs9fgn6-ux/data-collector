# data-collector 新闻采集工作流
# 使用 RSS/Atom + feedparser + GDELT/Hacker News
# 所有数据源无需 API Key

name: News Collection

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '每条新闻源采集条数（默认50）'
        type: number
        default: 50
      skip_sign:
        description: '跳过签名（测试用）'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 pyyaml

      - name: 创建暂存区目录
        run: mkdir -p staging

      - name: 采集新闻
        run: |
          echo "📡 开始采集新闻..."
          python scripts/collect_news.py --limit ${{ github.event.inputs.limit || 15 }}
        continue-on-error: true

      - name: 去重与筛选
        run: |
          echo "🔍 开始去重与筛选..."
          python scripts/filter_news.py
        continue-on-error: true

      - name: 打包新闻数据
        run: |
          echo "📦 开始打包..."
          python scripts/pack_news.py
        continue-on-error: true

      - name: 数据签名
        if: github.event.inputs.skip_sign != 'true'
        run: |
          echo "🔐 开始签名..."
          python scripts/sign_news.py
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        continue-on-error: true

      - name: 安全检查
        run: |
          echo "🛡️ 开始安全检查..."
          python scripts/security_check.py
        continue-on-error: true

      - name: 清理过期文件
        run: |
          echo "🧹 开始清理过期文件..."
          python scripts/cleanup.py --days 7
        continue-on-error: true

      - name: 上传新闻数据包
        uses: actions/upload-artifact@v4
        with:
          name: news-data
          path: staging/news_package_*.json
          retention-days: 7

      - name: 完成日志
        run: |
          echo "✅ 新闻采集完成: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "📂 文件列表:"
          ls -la staging/ 2>/dev/null || echo "   (空)"
