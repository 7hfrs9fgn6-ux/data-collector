# data-collector 新闻采集工作流（N-13 迁移）
# 每30分钟采集一次，生成签名新闻数据包
# 与 collect.yml（GitHub数据采集）独立并行运行

name: News Collection

on:
  # ============================================================
  # 定时触发：每30分钟一次（北京时间）
  #   对应 UTC: */30 * * * *
  # ============================================================
  schedule:
    - cron: '*/30 * * * *'

  # ============================================================
  # 手动触发：允许在 Actions 页面点击 "Run workflow"
  # ============================================================
  workflow_dispatch:
    inputs:
      limit:
        description: '每条新闻源采集条数（默认15）'
        type: number
        default: 15
      skip_sign:
        description: '跳过签名（测试用）'
        type: boolean
        default: false

# ============================================================
# 权限配置（最小化）
# ============================================================
permissions:
  contents: read
  actions: write

# ============================================================
# 环境变量
# ============================================================
env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml

      - name: 创建暂存区目录
        run: mkdir -p staging

      # ============================================================
      # 步骤1：采集新闻（多源）
      # ============================================================
      - name: 采集新闻（多源）
        run: |
          echo "📡 开始采集新闻..."
          python scripts/collect_news.py --limit ${{ github.event.inputs.limit || 15 }}
        env:
          TIANXING_API_KEY: ${{ secrets.TIANXING_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        continue-on-error: true

      # ============================================================
      # 步骤2：去重 + 筛选（URL指纹 + Title MD5）
      # ============================================================
      - name: 去重与筛选
        run: |
          echo "🔍 开始去重与筛选..."
          python scripts/filter_news.py
        continue-on-error: true

      # ============================================================
      # 步骤3：打包（标准化JSON + 元数据）
      # ============================================================
      - name: 打包新闻数据
        run: |
          echo "📦 开始打包..."
          python scripts/pack_news.py
        continue-on-error: true

      # ============================================================
      # 步骤4：签名（HMAC-SHA256）
      # ============================================================
      - name: 数据签名
        if: github.event.inputs.skip_sign != 'true'
        run: |
          echo "🔐 开始签名..."
          python scripts/sign_news.py
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        continue-on-error: true

      # ============================================================
      # 步骤5：安全检查（确认不含敏感关键词）
      # ============================================================
      - name: 安全检查
        run: |
          echo "🛡️ 开始安全检查..."
          python scripts/security_check.py
        continue-on-error: true

      # ============================================================
      # 步骤6：清理过期新闻文件（保留7天）
      # ============================================================
      - name: 清理过期文件
        run: |
          echo "🧹 开始清理过期文件..."
          python scripts/cleanup.py --days 7
        continue-on-error: true

      # ============================================================
      # 步骤7：生成采集统计报告
      # ============================================================
      - name: 生成统计报告
        run: |
          echo "📊 ========================================"
          echo "📊 新闻采集完成统计"
          echo "📊 ========================================"
          echo "📅 时间: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo ""
          echo "📂 暂存区文件列表:"
          ls -la staging/*.json 2>/dev/null | wc -l | xargs echo "   文件数:"
          echo ""
          echo "📦 最新文件:"
          ls -lt staging/*.json 2>/dev/null | head -3
          echo ""
          echo "📊 ========================================"

      # ============================================================
      # 步骤8：上传 Artifact（供私密库拉取）
      # ============================================================
      - name: 上传新闻数据包
        uses: actions/upload-artifact@v4
        with:
          name: news-data
          path: staging/news_*.json
          retention-days: 7

      - name: 完成日志
        run: |
          echo "✅ 新闻采集完成: $(date '+%Y-%m-%d %H:%M:%S %Z')"
