# data-collector 外围数据汇总打包工作流
# 汇总：港股 + 欧洲 + 美股 + 万年历
# 频率：每日 06:00（所有外围市场已收盘）
# 输出：global_package_*.json（统一外围数据包）

name: 🌍 外围数据汇总打包

on:
  schedule:
    - cron: '0 6 * * *'              # 每日 06:00 执行（美股05:00收盘后）
  workflow_dispatch:                  # 支持手动触发

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

jobs:
  pack-global:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: 🌍 汇总外围数据

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml pytz

      - name: 📁 创建暂存区目录
        run: mkdir -p staging

      - name: 📥 下载关联 Artifact（港股数据）
        uses: actions/download-artifact@v4
        with:
          name: hk-stock-data
          path: staging/
        continue-on-error: true

      - name: 📥 下载关联 Artifact（欧洲数据）
        uses: actions/download-artifact@v4
        with:
          name: eu-stock-data
          path: staging/
        continue-on-error: true

      - name: 📥 下载关联 Artifact（美股数据）
        uses: actions/download-artifact@v4
        with:
          name: us-stock-data
          path: staging/
        continue-on-error: true

      - name: 📥 下载关联 Artifact（万年历数据）
        uses: actions/download-artifact@v4
        with:
          name: calendar-data
          path: staging/
        continue-on-error: true

      - name: 🌍 汇总打包外围数据
        run: python scripts/pack_global.py
        continue-on-error: true

      - name: 📋 打印暂存区状态
        run: |
          echo "📦 外围数据文件列表:"
          ls -la staging/ | grep -E "global|hk_stock|eu_stock|us_stock|calendar" || echo "   (暂无文件)"
          echo ""
          echo "📊 文件统计:"
          echo "   - 外围打包文件: $(ls staging/ 2>/dev/null | grep -E 'global_package_.*\.json' | wc -l)"

      - name: 📤 上传 Artifact（外围汇总数据）
        uses: actions/upload-artifact@v4
        with:
          name: global-data
          path: staging/global_package_*.json
          retention-days: 7

      - name: ✅ 打包完成
        if: success()
        run: |
          echo "✅ 外围数据汇总打包完成"
          echo "   🌍 包含: 港股 + 欧洲 + 美股 + 万年历"
          echo "   🕐 打包时间: 06:00（所有外围已收盘）"
          echo "   📦 数据包格式: 统一格式（含 trade_date/is_trading_day）"
