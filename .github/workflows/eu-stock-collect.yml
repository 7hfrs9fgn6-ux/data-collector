# data-collector 欧洲指数采集工作流
# 采集：德国DAX、英国富时100、法国CAC40
# 频率：每日 01:00（欧洲收盘后）
# 数据源：yfinance
# 输出：eu_stock_package_*.json（统一格式数据包）

name: 🇪🇺 欧洲指数采集

on:
  schedule:
    - cron: '0 1 * * *'              # 每日 01:00 执行（欧洲收盘后）
  workflow_dispatch:                  # 支持手动触发

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

jobs:
  collect-eu-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: 🇪🇺 采集欧洲指数

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests pyyaml pytz yfinance

      - name: 📁 创建暂存区目录
        run: mkdir -p staging

      - name: 🇪🇺 采集欧洲指数
        run: python scripts/collect_eu_stock.py
        continue-on-error: true

      - name: 📦 打包欧洲数据（统一格式）
        run: python scripts/pack_eu_stock.py
        continue-on-error: true

      - name: 📋 打印暂存区状态
        run: |
          echo "📦 欧洲数据文件列表:"
          ls -la staging/ | grep -E "eu_stock" || echo "   (暂无文件)"
          echo ""
          echo "📊 文件统计:"
          echo "   - 采集文件: $(ls staging/ 2>/dev/null | grep -E 'eu_stock_[0-9]{8}_[0-9]{6}\.json' | wc -l)"
          echo "   - 打包文件: $(ls staging/ 2>/dev/null | grep -E 'eu_stock_package_.*\.json' | wc -l)"

      - name: 📤 上传 Artifact（欧洲打包数据）
        uses: actions/upload-artifact@v4
        with:
          name: eu-stock-data
          path: staging/eu_stock_package_*.json
          retention-days: 7

      - name: ✅ 采集完成
        if: success()
        run: |
          echo "✅ 欧洲指数采集完成"
          echo "   🇪🇺 包含: 德国DAX、英国富时100、法国CAC40"
          echo "   🕐 采集时间: 01:00（欧洲已收盘）"
          echo "   📦 数据包格式: 统一格式（含 trade_date/is_trading_day）"
          echo "   📡 数据源: yfinance"
