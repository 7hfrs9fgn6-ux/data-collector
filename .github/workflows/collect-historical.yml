# data-collector 历史数据采集工作流
# 采集：几十年历史行情数据、宏观数据、事件数据
# 频率：每周一次（数据量较大，无需高频）
# 定位：一次性/低频采集，与现有实时采集工作流互补

name: Historical Data Collection

on:
  schedule:
    - cron: '0 2 * * 0'          # 每周日凌晨2:00
  workflow_dispatch:
    inputs:
      force_refresh:
        description: '强制刷新（重新采集全部）'
        type: boolean
        default: false
      years:
        description: '采集历史年数'
        type: number
        default: 30

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  collect-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas yfinance requests pyyaml

      - name: 创建暂存区目录
        run: mkdir -p staging

      - name: 采集历史行情数据
        run: |
          echo "📈 采集历史行情数据..."
          python scripts/collect_historical.py --type market --years ${{ github.event.inputs.years || 30 }}
        continue-on-error: true

      - name: 采集历史宏观数据
        run: |
          echo "🏛️ 采集历史宏观数据..."
          python scripts/collect_historical.py --type macro --years ${{ github.event.inputs.years || 30 }}
        continue-on-error: true

      - name: 采集历史事件数据
        run: |
          echo "📰 采集历史事件数据..."
          python scripts/collect_historical.py --type events --years ${{ github.event.inputs.years || 30 }}
        continue-on-error: true

      - name: 采集历史板块数据
        run: |
          echo "📊 采集历史板块数据..."
          python scripts/collect_historical.py --type sector --years ${{ github.event.inputs.years || 20 }}
        continue-on-error: true

      - name: 打包历史数据
        run: |
          echo "📦 打包历史数据..."
          python scripts/pack_historical.py
        continue-on-error: true

      - name: 数据签名
        run: |
          echo "🔐 签名..."
          python scripts/sign.py
        continue-on-error: true

      - name: 安全检查
        run: |
          echo "🛡️ 安全检查..."
          python scripts/security_check.py
        continue-on-error: true

      - name: 打印暂存区状态
        run: |
          echo "📊 文件列表:"
          ls -la staging/ | grep historical || echo "   (暂无历史数据文件)"

      - name: 上传 Artifact（历史数据包）
        uses: actions/upload-artifact@v4
        with:
          name: historical-data
          path: staging/historical_*_signed.json
          retention-days: 30

      - name: 完成日志
        run: |
          echo "✅ 历史数据采集完成: $(date '+%Y-%m-%d %H:%M:%S %Z')"
