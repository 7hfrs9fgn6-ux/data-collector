# data-collector 历史数据采集工作流
# 采集：几十年历史行情、宏观、事件、板块数据
# 频率：每12小时一次（每日06:00和18:00，北京时间）
# ★ ★ ★ 2026-08-29 修改：采集频率从每周一次提升至每日两次 ★ ★ ★

name: Historical Data Collection

on:
  schedule:
    - cron: '0 6,18 * * *'        # 每天 06:00 和 18:00（北京时间）
  workflow_dispatch:
    inputs:
      years:
        description: '采集历史年数（默认30）'
        type: number
        default: 30
      debug:
        description: '启用调试模式（保存原始数据）'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  collect-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas yfinance requests pyyaml

      - name: 创建暂存区目录
        run: mkdir -p staging

      - name: 采集并打包历史数据
        run: |
          echo "🚀 开始采集历史数据..."
          echo "   📈 年数: ${{ github.event.inputs.years || 30 }}"
          echo "   🐞 调试模式: ${{ github.event.inputs.debug || false }}"
          
          DEBUG_FLAG=""
          if [[ "${{ github.event.inputs.debug }}" == "true" ]]; then
            DEBUG_FLAG="--debug"
          fi
          
          python scripts/collect_historical.py \
            --type all \
            --years ${{ github.event.inputs.years || 30 }} \
            $DEBUG_FLAG

      - name: 打印暂存区状态
        run: |
          echo "📦 历史数据文件列表:"
          ls -la staging/ | grep -E "historical_package" || echo "   (暂无文件)"
          echo ""
          if ls staging/ | grep -q "historical_package"; then
            FILE=$(ls staging/ | grep historical_package | head -1)
            echo "📊 文件大小: $(du -h staging/$FILE | cut -f1)"
            echo "🔐 签名状态: $(grep -o '"signature": "[^"]*"' staging/$FILE | head -1 || echo '无签名')"
          fi

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: historical-data
          path: staging/historical_package_*.json
          retention-days: 30

      - name: 完成日志
        run: |
          echo "✅ 历史数据采集完成: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          if ls staging/ | grep -q "historical_package"; then
            echo "📦 Artifact 已生成"
          else
            echo "⚠️ 未生成 historical_package，请检查日志"
          fi
