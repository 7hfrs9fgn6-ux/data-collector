# P4阶段：安全审计工作流
# 用途：扫描代码中的敏感信息（V系统术语、持仓代码、内部路径等）
# 运行方式：workflow_dispatch 手动触发

name: Security Audit

on:
  workflow_dispatch:
    inputs:
      repo_type:
        description: '仓库类型'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - private

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Shanghai

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行安全审计
        run: |
          python -c "
          import os
          import re
          import sys
          from pathlib import Path
          from datetime import datetime

          # ============================================================
          # 敏感模式定义
          # ============================================================

          SENSITIVE_PATTERNS = {
              # 1. V系统专有术语
              'v_system_terms': {
                  'patterns': [
                      r'V系统',
                      r'v-system',
                      r'VSystem',
                      r'v_system',
                      r'V_SYSTEM',
                  ],
                  'severity': 'error',
                  'description': 'V系统专有术语'
              },
              # 2. 持仓基金代码
              'fund_codes': {
                  'patterns': [
                      r'009777',
                      r'006229',
                      r'001632',
                      r'260108',
                      r'012414',
                      r'012417',
                  ],
                  'severity': 'error',
                  'description': '持仓基金代码'
              },
              # 3. V系统内部路径引用
              'internal_paths': {
                  'patterns': [
                      r'from core\.',
                      r'from data_adapter\.',
                      r'from output_layer\.',
                      r'from scripts\.',
                      r'import core\.',
                      r'import data_adapter\.',
                  ],
                  'severity': 'warning',
                  'description': 'V系统内部路径引用'
              },
              # 4. V系统策略关键词
              'strategy_keywords': {
                  'patterns': [
                      r'state_machine',
                      r'risk_controller',
                      r'signal_level',
                      r'multi_factor',
                      r'多因子',
                      r'风控',
                      r'信号等级',
                      r'V系统状态机',
                      r'VSystemStateMachine',
                  ],
                  'severity': 'warning',
                  'description': 'V系统策略关键词'
              },
              # 5. Token/密钥泄露
              'tokens': {
                  'patterns': [
                      r'[a-zA-Z0-9]{35,45}',  # 疑似 Token
                      r'ghp_[a-zA-Z0-9]{36}',
                      r'gho_[a-zA-Z0-9]{36}',
                      r'sk-[a-zA-Z0-9]{48}',
                  ],
                  'severity': 'error',
                  'description': '疑似 API Token/密钥'
              },
          }

          # ============================================================
          # 扫描函数
          # ============================================================

          def scan_file(filepath: Path, repo_type: str) -> list:
              findings = []
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                      lines = content.split('\n')
              except Exception:
                  return findings

              for category, config in SENSITIVE_PATTERNS.items():
                  for pattern in config['patterns']:
                      for i, line in enumerate(lines, 1):
                          if re.search(pattern, line, re.IGNORECASE):
                              # 跳过 public 仓库中对 private 库的引用（允许）
                              if repo_type == 'public' and 'from core.' in line:
                                  continue
                              if repo_type == 'public' and 'from data_adapter.' in line:
                                  continue
                              findings.append({
                                  'file': str(filepath),
                                  'line': i,
                                  'content': line.strip()[:200],
                                  'category': category,
                                  'pattern': pattern,
                                  'severity': config['severity'],
                                  'description': config['description']
                              })
                              break  # 每行只报一次
              return findings

          # ============================================================
          # 主程序
          # ============================================================

          repo_type = '${{ github.event.inputs.repo_type }}'
          print('=' * 70)
          print('🔒 P4安全审计')
          print(f'   仓库类型: {repo_type}')
          print(f'   时间: {datetime.now().strftime("%Y-%m-%d %H:%M:%S")}')
          print('=' * 70)

          # 扫描目录
          scan_dirs = ['scripts', 'core', 'data_adapter', 'output_layer', '.github/workflows']
          all_findings = []
          files_scanned = 0

          for dir_name in scan_dirs:
              dir_path = Path(dir_name)
              if not dir_path.exists():
                  continue
              for ext in ['*.py', '*.yml', '*.yaml', '*.md', '*.txt', '*.sh']:
                  for filepath in dir_path.glob('**/' + ext):
                      files_scanned += 1
                      findings = scan_file(filepath, repo_type)
                      all_findings.extend(findings)

          # 统计
          errors = [f for f in all_findings if f['severity'] == 'error']
          warnings = [f for f in all_findings if f['severity'] == 'warning']

          print(f'\n📊 扫描统计:')
          print(f'   文件数: {files_scanned}')
          print(f'   发现问题: {len(all_findings)} 个')
          print(f'   ❌ 错误: {len(errors)} 个')
          print(f'   ⚠️ 警告: {len(warnings)} 个')

          # 输出详细发现
          if all_findings:
              print('\n📋 发现详情:')
              print('-' * 70)
              for f in all_findings:
                  severity_mark = '🔴' if f['severity'] == 'error' else '🟡'
                  print(f'{severity_mark} [{f["severity"].upper()}] {f["file"]}:{f["line"]}')
                  print(f'   {f["description"]} → {f["content"][:80]}')
                  print()

          # 生成报告文件
          report_path = Path('security_audit_report.json')
          import json
          report = {
              'timestamp': datetime.now().isoformat(),
              'repo_type': repo_type,
              'files_scanned': files_scanned,
              'total_findings': len(all_findings),
              'errors': len(errors),
              'warnings': len(warnings),
              'findings': all_findings
          }
          with open(report_path, 'w') as f:
              json.dump(report, f, indent=2, ensure_ascii=False)
          print(f'\n📄 报告已保存: {report_path}')

          # 退出码
          if errors:
              print(f'\n❌ 发现 {len(errors)} 个错误，请修复后重新审计')
              sys.exit(2)
          elif warnings:
              print(f'\n⚠️ 发现 {len(warnings)} 个警告，建议检查')
              sys.exit(1)
          else:
              print('\n✅ 安全审计通过！')
              sys.exit(0)
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传审计报告
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report-${{ github.event.inputs.repo_type }}
          path: security_audit_report.json
          retention-days: 30

      - name: 输出摘要
        run: |
          echo "### 🔒 安全审计报告" >> $GITHUB_STEP_SUMMARY
          echo "仓库类型: ${{ github.event.inputs.repo_type }}" >> $GITHUB_STEP_SUMMARY
          echo "时间: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f security_audit_report.json ]; then
            cat security_audit_report.json | jq -r '
              "| 指标 | 数值 |",
              "|:---|:---:|",
              "| 扫描文件数 | \(.files_scanned) |",
              "| 发现问题总数 | \(.total_findings) |",
              "| ❌ 错误 | \(.errors) |",
              "| ⚠️ 警告 | \(.warnings) |"
            ' >> $GITHUB_STEP_SUMMARY
          fi
