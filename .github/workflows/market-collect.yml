# data-collector 市场数据采集工作流
# 采集：大宗商品、板块回撤、宏观数据、汇率
# 频率：每6小时（0,6,12,18点）
# ★ ★ ★ 2026-09-06 修改：移除美股采集（已独立）、取消21:30批次 ★ ★ ★

name: 市场数据采集（大宗商品/板块/宏观/汇率）

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'     # 每6小时采集一次
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

jobs:
  collect-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: 采集市场数据

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare yfinance pandas-datareader requests pyyaml feedparser beautifulsoup4

      - name: 📁 创建暂存区目录
        run: mkdir -p staging

      - name: 🛢️ 采集大宗商品
        run: python scripts/collect_commodity.py
        continue-on-error: true

      - name: 📊 采集板块回撤
        run: python scripts/collect_sector.py
        continue-on-error: true

      - name: 🌐 采集宏观数据
        run: python scripts/collect_macro.py
        continue-on-error: true

      - name: 💱 采集汇率
        run: python scripts/collect_forex.py
        continue-on-error: true

      - name: 🔏 数据签名
        run: python scripts/sign.py
        continue-on-error: true

      - name: 📦 打包市场数据
        run: python scripts/pack_market.py
        continue-on-error: true

      - name: 📋 打印暂存区状态
        run: |
          echo "📦 市场数据文件列表:"
          ls -la staging/ | grep -E "_signed" || echo "   (暂无签名文件)"
          echo ""
          echo "📊 文件统计:"
          echo "   - 宏观文件: $(ls staging/ | grep -E 'macro.*_signed\.json' | wc -l)"
          echo "   - 板块文件: $(ls staging/ | grep -E 'sector.*_signed\.json' | wc -l)"
          echo "   - 汇率文件: $(ls staging/ | grep -E 'forex.*_signed\.json' | wc -l)"
          echo "   - 大宗商品文件: $(ls staging/ | grep -E 'commodity.*_signed\.json' | wc -l)"

      # ============================================================
      # ★ 上传市场数据包（不含美股）
      # ============================================================
      - name: 📤 上传 Artifact（市场数据）
        uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: staging/market_package_*.json
          retention-days: 7

      - name: ✅ 采集完成
        if: success()
        run: |
          echo "✅ 市场数据采集完成"
          echo "   📦 包含: 大宗商品、板块、宏观、汇率"
