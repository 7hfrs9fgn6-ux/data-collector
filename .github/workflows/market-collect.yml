# data-collector 市场数据采集工作流
# 采集：大宗商品、宏观、美股、板块回撤、汇率
# 频率：每小时

name: Market Data Collection

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

jobs:
  collect-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare yfinance pandas-datareader requests pyyaml feedparser beautifulsoup4 akshare-proxy-patch

      - name: 创建暂存区目录
        run: mkdir -p staging

      - name: 采集大宗商品
        run: python scripts/collect_commodity.py
        continue-on-error: true

      - name: 采集板块回撤
        run: python scripts/collect_sector.py
        continue-on-error: true

      - name: 采集宏观数据
        run: python scripts/collect_macro.py
        continue-on-error: true

      - name: 采集美股指数
        run: python scripts/collect_us_stock.py
        continue-on-error: true

      - name: 采集汇率
        run: python scripts/collect_forex.py
        continue-on-error: true

      - name: 数据签名（补充）
        run: python scripts/sign.py
        continue-on-error: true

      - name: 打印暂存区状态
        run: |
          echo "📦 市场数据文件列表:"
          ls -la staging/ | grep -E "commodity|sector|macro|us_stock|forex" || echo "   (暂无市场数据文件)"

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: staging/*_*.json
          retention-days: 7
