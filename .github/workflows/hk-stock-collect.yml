# data-collector 港股指数采集工作流
# 采集：恒生指数、恒生科技指数、国企指数
# 频率：每日 17:00（港股 16:00 收盘后）
# 数据源：yfinance → akshare → 缓存
# 输出：hk_stock_package_*.json（统一格式数据包）

name: 🇭🇰 港股指数采集

on:
  schedule:
    - cron: '0 17 * * *'              # 每日 17:00 执行
  workflow_dispatch:                  # 支持手动触发

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

jobs:
  collect-hk-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: 🇭🇰 采集港股指数

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests pyyaml pytz yfinance

      - name: 📁 创建暂存区目录
        run: mkdir -p staging

      - name: 🇭🇰 采集港股指数
        run: python scripts/collect_hk_stock.py
        continue-on-error: true

      - name: 📋 打印暂存区状态
        run: |
          echo "📦 港股数据文件列表:"
          ls -la staging/ | grep -E "hk_stock" || echo "   (暂无文件)"
          echo ""
          echo "📊 文件统计:"
          echo "   - 采集文件: $(ls staging/ | grep -E 'hk_stock_[0-9]{8}_[0-9]{6}\.json' | wc -l)"
          echo "   - 打包文件: $(ls staging/ | grep -E 'hk_stock_package_.*\.json' | wc -l)"

      - name: 📤 上传 Artifact（港股打包数据）
        uses: actions/upload-artifact@v4
        with:
          name: hk-stock-data
          path: staging/hk_stock_package_*.json
          retention-days: 7

      - name: ✅ 采集完成
        if: success()
        run: |
          echo "✅ 港股指数采集完成"
          echo "   🇭🇰 包含: 恒生指数、恒生科技、国企指数"
          echo "   🕐 采集时间: 17:00（港股已收盘）"
          echo "   📦 数据包格式: 统一格式（含 trade_date/is_trading_day）"
          echo "   📡 数据源: yfinance → akshare → 缓存"
