name: 市场知识采集

on:
  # 定时触发：每天 18:30 和 22:30（北京时间）
  schedule:
    - cron: '30 10 * * *'   # 18:30 北京时间 = 10:30 UTC
    - cron: '30 14 * * *'   # 22:30 北京时间 = 14:30 UTC

  # 手动触发
  workflow_dispatch:
    inputs:
      time_slot:
        description: '采集时段'
        required: true
        default: '1830'
        type: choice
        options:
          - '1830'
          - '2230'

  # 代码推送时触发（仅当采集脚本变更）
  push:
    paths:
      - 'scripts/collect_market_knowledge.py'
      - '.github/workflows/collect-knowledge.yml'

env:
  TZ: 'Asia/Shanghai'

jobs:
  collect-knowledge:
    name: 采集市场知识
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ---- 1. 检出代码 ----
      - name: 📥 检出代码
        uses: actions/checkout@v4

      # ---- 2. 设置 Python ----
      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ---- 3. 安装依赖 ----
      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyyaml
          pip install akshare yfinance || true

      # ---- 4. 创建工作目录 ----
      - name: 📁 创建工作目录
        run: |
          mkdir -p data/knowledge
          mkdir -p data/news
          mkdir -p data/macro
          mkdir -p data/sector
          mkdir -p data/us_stock

      # ---- 5. 运行知识采集 ----
      - name: 🧠 运行知识采集
        id: collect
        env:
          DATA_SIGNING_KEY: ${{ secrets.DATA_SIGNING_KEY }}
        run: |
          echo "🚀 开始市场知识采集..."
          echo ""
          
          # 判断采集时段
          if [ "${{ github.event.inputs.time_slot }}" == "2230" ] || [ "${{ github.event.schedule }}" == "30 14 * * *" ]; then
            TIME_SLOT="2230"
          else
            TIME_SLOT="1830"
          fi
          
          echo "📌 采集时段: $TIME_SLOT"
          echo ""
          
          # 运行采集脚本
          python scripts/collect_market_knowledge.py --time "$(date '+%Y-%m-%d %H:%M:%S')"
          
          # 检查生成的文件
          echo ""
          echo "📄 生成的文件列表:"
          ls -la data/knowledge/ || echo "   ⚠️ 无文件生成"
          
          # 获取最新生成的文件名
          LATEST_FILE=$(ls -t data/knowledge/knowledge_package_*.json 2>/dev/null | head -1)
          if [ -n "$LATEST_FILE" ]; then
            echo "✅ 最新文件: $LATEST_FILE"
            echo "file_name=$(basename $LATEST_FILE)" >> $GITHUB_OUTPUT
            echo "file_path=$LATEST_FILE" >> $GITHUB_OUTPUT
          else
            echo "⚠️ 未生成知识数据包"
            exit 1
          fi

      # ---- 6. 提交并推送 ----
      - name: 📤 提交并推送
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加知识数据文件
          git add data/knowledge/knowledge_package_*.json
          
          # 检查是否有变更
          if git diff --cached --quiet; then
            echo "ℹ️ 无变更需要提交"
            exit 0
          fi
          
          # 提交变更
          TIMESTAMP=$(date '+%Y%m%d_%H%M%S')
          git commit -m "chore: 自动更新市场知识数据包 (${TIMESTAMP})"
          
          # 推送到仓库
          git push origin main
          
          echo "✅ 已提交并推送知识数据包"

      # ---- 7. 生成采集摘要 ----
      - name: 📊 采集摘要
        if: always()
        run: |
          echo "=========================================="
          echo "📊 市场知识采集摘要"
          echo "=========================================="
          echo ""
          echo "采集时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "采集时段: ${{ github.event.inputs.time_slot || '定时' }}"
          echo ""
          
          if [ -n "${{ steps.collect.outputs.file_name }}" ]; then
            echo "✅ 生成文件: ${{ steps.collect.outputs.file_name }}"
            echo "📂 文件路径: ${{ steps.collect.outputs.file_path }}"
            
            # 显示文件内容摘要
            if [ -f "${{ steps.collect.outputs.file_path }}" ]; then
              echo ""
              echo "📄 文件摘要:"
              cat "${{ steps.collect.outputs.file_path }}" | head -50 || echo "   ⚠️ 无法读取文件"
            fi
          else
            echo "❌ 未生成知识数据包"
          fi
          
          echo ""
          echo "=========================================="
