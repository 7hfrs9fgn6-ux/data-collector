# data-collector 知识采集工作流
# 采集市场知识/经验/规律，打包成通用格式供私密库使用
# 频率：每3小时一次（与市场数据采集频率一致）

name: 知识采集

on:
  schedule:
    - cron: '0 */3 * * *'   # 每3小时一次（UTC时间）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

jobs:
  collect-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare yfinance pandas-datareader requests pyyaml feedparser beautifulsoup4 pandas numpy

      - name: 创建输出目录
        run: mkdir -p data/knowledge

      - name: 采集市场知识
        run: |
          echo "📊 开始采集市场知识..."
          python scripts/collect_market_knowledge.py --output ./data/knowledge/
        continue-on-error: false

      - name: 数据签名（payload 格式）
        run: |
          echo "🔐 开始签名..."
          python scripts/sign.py
        continue-on-error: true

      - name: 安全检查
        run: |
          echo "🛡️ 开始安全检查..."
          python scripts/security_check.py
        continue-on-error: true

      - name: 打印采集结果
        run: |
          echo "📦 知识数据文件列表:"
          ls -la data/knowledge/ 2>/dev/null || echo "   (暂无文件)"
          echo ""
          echo "📊 最新知识包:"
          ls -t data/knowledge/knowledge_package_*.json 2>/dev/null | head -1 || echo "   (暂无)"

      - name: 上传 Artifact（供私密库拉取）
        uses: actions/upload-artifact@v4
        with:
          name: collected-data
          path: data/knowledge/*.json
          retention-days: 7

      - name: 提交到仓库（持久化存储）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/knowledge/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 无新数据需要提交"
          else
            git commit -m "📊 知识采集更新: $(date '+%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ 数据已提交到仓库"
          fi

      - name: 清理旧文件（保留30天）
        run: |
          echo "🧹 清理 30 天前的知识数据..."
          find data/knowledge/ -name "knowledge_package_*.json" -type f -mtime +30 -delete 2>/dev/null || true
          REMAINING=$(ls data/knowledge/knowledge_package_*.json 2>/dev/null | wc -l)
          echo "✅ 剩余文件: $REMAINING 个"
