# data-collector 知识采集工作流
# 采集市场知识/经验/规律，打包成通用格式供私密库使用
# ★ 前置依赖：先运行 sector 和 macro 采集，确保数据可用 ★

name: 知识采集

on:
  schedule:
    - cron: '0 */3 * * *'   # 每3小时一次
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

jobs:
  collect-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare yfinance pandas-datareader requests pyyaml feedparser beautifulsoup4 pandas numpy

      - name: 创建暂存区目录
        run: mkdir -p staging

      # ============================================================
      # ★ 步骤1：运行市场数据采集（前置依赖）
      # ============================================================
      - name: 采集板块数据（前置依赖）
        run: |
          echo "📈 采集板块回撤数据..."
          python scripts/collect_sector.py
        continue-on-error: true

      - name: 采集宏观数据（前置依赖）
        run: |
          echo "🌐 采集宏观数据..."
          python scripts/collect_macro.py
        continue-on-error: true

      - name: 采集大宗商品（前置依赖）
        run: |
          echo "🛢️ 采集大宗商品..."
          python scripts/collect_commodity.py
        continue-on-error: true

      - name: 采集美股指数（前置依赖）
        run: |
          echo "🇺🇸 采集美股指数..."
          python scripts/collect_us_stock.py
        continue-on-error: true

      - name: 采集汇率（前置依赖）
        run: |
          echo "💵 采集汇率..."
          python scripts/collect_forex.py
        continue-on-error: true

      # ============================================================
      # ★ 步骤2：知识采集（基于上述数据）
      # ============================================================
      - name: 采集市场知识
        run: |
          echo "📊 开始采集市场知识..."
          python scripts/collect_market_knowledge.py --output ./staging/
        continue-on-error: false

      # ============================================================
      # ★ 步骤3：签名与检查
      # ============================================================
      - name: 数据签名（扫描所有 staging 文件）
        run: |
          echo "🔐 开始签名..."
          python scripts/sign.py
        continue-on-error: true

      - name: 安全检查
        run: |
          echo "🛡️ 开始安全检查..."
          python scripts/security_check.py
        continue-on-error: true

      # ============================================================
      # ★ 步骤4：输出与上传
      # ============================================================
      - name: 打印暂存区状态
        run: |
          echo "📦 暂存区文件列表:"
          ls -la staging/
          echo ""
          echo "📊 最新知识包:"
          ls -t staging/knowledge_package_*.json 2>/dev/null | head -1 || echo "   (暂无)"
          echo ""
          echo "📊 所有签名文件:"
          ls -t staging/*_signed.json 2>/dev/null | head -5 || echo "   (暂无)"

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: collected-data
          path: staging/*_signed.json
          retention-days: 7

      - name: 提交到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add staging/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 无新数据需要提交"
          else
            git commit -m "📊 知识采集更新: $(date '+%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ 数据已提交到仓库"
          fi

      - name: 清理旧文件（保留30天）
        run: |
          echo "🧹 清理 30 天前的知识数据..."
          find staging/ -name "knowledge_package_*.json" -type f -mtime +30 -delete 2>/dev/null || true
          REMAINING=$(ls staging/knowledge_package_*.json 2>/dev/null | wc -l)
          echo "✅ 剩余文件: $REMAINING 个"
