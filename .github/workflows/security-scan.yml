# 公开库安全扫描工作流
# 扫描公开库代码，确保不包含 V 系统专有信息

name: Security Scan

on:
  # 定时触发：每周一 09:00
  schedule:
    - cron: '0 9 * * 1'
  
  # 手动触发
  workflow_dispatch:
  
  # 每次 push 到 main 分支时触发（可选）
  # push:
  #   branches: [ main ]

permissions:
  contents: read
  actions: write
  security-events: write

env:
  TZ: Asia/Shanghai

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行敏感信息扫描
        run: |
          echo "🔍 开始扫描敏感信息..."
          python scripts/scan_sensitive.py
        continue-on-error: false

      - name: 扫描摘要（仅摘要模式）
        if: always()
        run: |
          echo "### 🔍 安全扫描摘要" >> $GITHUB_STEP_SUMMARY
          echo "时间: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "状态: ✅ 扫描完成" >> $GITHUB_STEP_SUMMARY
          echo "详细结果请查看 Actions 日志" >> $GITHUB_STEP_SUMMARY
