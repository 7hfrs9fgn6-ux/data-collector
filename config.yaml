# data-collector 采集配置
# 普通开源项目风格

# ============================================================
# 采集配置
# ============================================================
collect:
  # GitHub Trending 采集
  github:
    enabled: true
    url: "https://github.com/trending"
    frequency_minutes: 30
    languages: ["python", "javascript", "go", "rust"]
    max_items: 50

  # ECC 仓库监控（已禁用）
  ecc:
    enabled: false
    repo: "https://github.com/ecc-community/ecc"
    frequency_minutes: 60
    max_items: 20

  # GitHub 搜索（量化/金融相关项目）
  github_search:
    enabled: true
    queries:
      - "quantitative trading"
      - "stock analysis"
      - "factor model"
      - "backtesting"
      - "alpha factor"
    max_items: 30

  # ============================================================
  # 新闻采集（公开库版）
  # ============================================================
  news:
    enabled: true
    frequency_minutes: 30
    max_items_per_source: 15
    max_total_items: 80
    max_age_hours: 24
    # RSS/Atom 订阅源列表（可自由增删）
    rss_feeds:
      - "https://news.google.com/rss/search?q=finance+stocks+when:1d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
      - "https://news.google.com/rss/search?q=economy+when:1d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
      - "https://feeds.bloomberg.com/markets/news.rss"
      - "https://www.cnbc.com/id/10001147/device/rss/rss.html"
    # 去重配置
    dedupe:
      enabled: true
      use_url_fingerprint: true
      use_title_md5: true
      title_similarity_threshold: 0.85

# ============================================================
# 分级筛选配置（L1/L2/L3）
# ============================================================
classification:
  l1_keywords:
    - "trading"
    - "quant"
    - "backtest"
    - "factor"
    - "alpha"
    - "signal"
    - "portfolio"
    - "risk"
    - "optimization"
    - "parameter"
    - "weight"
    - "threshold"
    - "momentum"
    - "reversal"
    - "arbitrage"
    - "volatility"
    - "correlation"
    - "regime"
    - "stop loss"
    - "take profit"
    - "drawdown"
    - "sharpe"
    - "calmar"
    - "sortino"
    - "market"
    - "analysis"
    - "strategy"
    - "indicator"
    - "financial"
    - "model"
    - "forecast"
    - "prediction"

  l2_keywords:
    - "research"
    - "paper"
    - "discussion"
    - "blog"
    - "tutorial"
    - "overview"
    - "news"
    - "guide"
    - "introduction"
    - "summary"
    - "review"
    - "data"
    - "dataset"
    - "finance"
    - "economic"

  l3_keywords: []

  thresholds:
    l1_min_matches: 3
    l1_star_threshold: 500
    l2_min_matches: 2

# ============================================================
# 暂存区配置（TTL）
# ============================================================
staging:
  path: "./staging/"
  ttl_hours: 24
  max_size_mb: 100
  max_files: 100
  cleanup_interval_hours: 6

# ============================================================
# 签名配置
# ============================================================
signature:
  enabled: true
  algorithm: "HMAC-SHA256"
  key_env: "SIGNING_KEY"

# ============================================================
# 安全检查配置（通用敏感词检查，不含任何项目特有信息）
# ============================================================
security_check:
  enabled: true
  blocked_keywords:
    - "secret"
    - "password"
    - "api_key"
    - "token"
    - "credential"
    - "confidential"
    - "internal"
  blocked_patterns:
    - ".*\\.local$"
    - ".*\\.internal$"
    - ".*\\.private$"
