# data-collector 采集配置
# 普通开源项目风格，不含任何V系统信息

# ============================================================
# 采集配置
# ============================================================
collect:
  # GitHub Trending 采集
  github:
    enabled: true
    url: "https://github.com/trending"
    frequency_minutes: 30
    languages: ["python", "javascript", "go", "rust"]
    max_items: 50

  # ECC 仓库监控（已禁用）
  ecc:
    enabled: false
    repo: "https://github.com/ecc-community/ecc"
    frequency_minutes: 60
    max_items: 20

  # GitHub 搜索（量化/金融相关项目）
  github_search:
    enabled: true
    queries:
      - "quantitative trading"
      - "stock analysis"
      - "factor model"
      - "backtesting"
      - "alpha factor"
    max_items: 30

# ============================================================
# 分级筛选配置（L1/L2/L3）
# ============================================================
classification:
  # L1：高价值信号（直接可用的优化建议）
  # 匹配条件：命中3个及以上关键词，或2个关键词+stars>500
  l1_keywords:
    - "trading"
    - "quant"
    - "backtest"
    - "factor"
    - "alpha"
    - "signal"
    - "portfolio"
    - "risk"
    - "optimization"
    - "parameter"
    - "weight"
    - "threshold"
    - "momentum"
    - "reversal"
    - "arbitrage"
    - "volatility"
    - "correlation"
    - "regime"
    - "stop loss"
    - "take profit"
    - "drawdown"
    - "sharpe"
    - "calmar"
    - "sortino"
    - "market"
    - "analysis"
    - "strategy"
    - "indicator"
    - "financial"
    - "model"
    - "forecast"
    - "prediction"

  # L2：中等价值线索
  l2_keywords:
    - "research"
    - "paper"
    - "discussion"
    - "blog"
    - "tutorial"
    - "overview"
    - "news"
    - "guide"
    - "introduction"
    - "summary"
    - "review"
    - "data"
    - "dataset"
    - "finance"
    - "economic"

  # L3：参考素材（默认分类）
  l3_keywords: []

  # 分级阈值
  thresholds:
    l1_min_matches: 3
    l1_star_threshold: 500
    l2_min_matches: 2

# ============================================================
# 暂存区配置（TTL）
# ============================================================
staging:
  path: "./staging/"
  ttl_hours: 24
  max_size_mb: 100
  max_files: 100
  cleanup_interval_hours: 6

# ============================================================
# 签名配置
# ============================================================
signature:
  enabled: true
  algorithm: "HMAC-SHA256"
  key_env: "SIGNING_KEY"

# ============================================================
# 安全检查配置
# ============================================================
security_check:
  enabled: true
  blocked_keywords:
    - "v-system"
    - "vsystem"
    - "VSystem"
    - "v_system"
    - "private_repo"
    - "内网"
  blocked_patterns:
    - ".*\\.local$"
    - ".*\\.internal$"
