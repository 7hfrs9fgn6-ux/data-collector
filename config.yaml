# data-collector 采集配置
# 普通开源项目风格

# ============================================================
# 采集配置
# ============================================================
collect:
  # GitHub Trending 采集
  github:
    enabled: true
    url: "https://github.com/trending"
    frequency_minutes: 30
    languages: ["python", "javascript", "go", "rust"]
    max_items: 50

  # ECC 仓库监控（已禁用）
  ecc:
    enabled: false
    repo: "https://github.com/ecc-community/ecc"
    frequency_minutes: 60
    max_items: 20

  # GitHub 搜索（量化/金融相关项目）
  github_search:
    enabled: true
    queries:
      - "quantitative trading"
      - "stock analysis"
      - "factor model"
      - "backtesting"
      - "alpha factor"
    max_items: 30

  # ============================================================
  # 新闻采集（公开库版）- 完整版
  # 覆盖：国际财经 + 中文财经 + AI/科技 + 宏观数据
  # 所有源均无需 API Key，零泄露风险
  # ============================================================
  news:
    enabled: true
    frequency_minutes: 30
    max_items_per_source: 50
    max_total_items: 400
    max_age_hours: 24

    # ============================================================
    # RSS/Atom 订阅源列表（按类别分组）
    # ============================================================
    rss_feeds:

      # ----- 1. 国际财经（核心） -----
      - "https://feeds.bloomberg.com/markets/news.rss"
      - "https://www.cnbc.com/id/10001147/device/rss/rss.html"
      - "https://www.cnbc.com/id/15837362/device/rss/rss.html"
      - "https://www.cnbc.com/id/15839135/device/rss/rss.html"
      - "https://www.ft.com/?format=rss"

      # ----- 2. 国际财经（补充） -----
      - "https://www.marketwatch.com/rss/headline"
      - "https://www.investing.com/rss/news_1063.rss"
      - "https://seekingalpha.com/tag/editors-picks.xml"
      - "https://www.marketbeat.com/rss/instant-alerts.xml"
      - "https://feeds.a.dj.com/rss/RSSMarketsMain.xml"

      # ----- 3. 中文财经（新增） -----
      - "https://rsshub.app/wallstreetcn/hot/"
      - "https://rsshub.app/jin10/important/"
      - "https://rsshub.app/cls/hot/"
      - "https://rsshub.app/36kr/news"
      - "https://rsshub.app/tencent/news/finance"
      - "https://rsshub.app/v2ex/hot"
      - "https://rsshub.app/weibo/search/财经"

      # ----- 4. AI / 前沿科技 -----
      - "https://feeds.feedburner.com/TechCrunch"
      - "https://techmeme.com/feed.xml"
      - "https://www.theverge.com/rss/index.xml"
      - "https://www.wired.com/feed/rss"
      - "https://www.technologyreview.com/feed"
      - "https://huggingface.co/blog/feed.xml"
      - "https://openai.com/news/rss.xml"
      - "https://www.anthropic.com/rss.xml"
      - "https://export.arxiv.org/rss/cs.AI"
      - "https://export.arxiv.org/rss/cs.LG"
      - "https://rsshub.app/producthunt/today"
      - "https://rsshub.app/dev.to"

      # ----- 5. 宏观与政策（新增） -----
      - "https://www.federalreserve.gov/feeds/press_all.xml"
      - "https://www.treasury.gov/press-center/news/Pages/rss.aspx"
      - "https://www.sec.gov/news/pressreleases.rss"

      # ----- 6. 备选：Reuters（部分可用） -----
      - "https://www.reuters.com/rss/businessNews"
      - "https://www.reuters.com/rss/marketsNews"

      # ----- 7. RSSHub 聚合（中国财经，备用） -----
      - "https://rsshub.app/eastmoney/kuaixun"
      - "https://rsshub.app/finance/163/latest"

      # ----- 8. 加密货币（新增） -----
      - "https://cointelegraph.com/rss"
      - "https://www.coindesk.com/arc/outboundfeeds/rss/"

      # ----- 9. 综合新闻（新增） -----
      - "https://rsshub.app/bbc/chinese"
      - "https://rsshub.app/reuters/news"
      - "https://rsshub.app/nytimes/global"
      - "https://rsshub.app/wsj/asia"

    # ============================================================
    # 去重配置
    # ============================================================
    dedupe:
      enabled: true
      use_url_fingerprint: true
      use_title_md5: true
      title_similarity_threshold: 0.85

# ============================================================
# 分级筛选配置（L1/L2/L3）
# ============================================================
classification:
  l1_keywords:
    - "trading"
    - "quant"
    - "backtest"
    - "factor"
    - "alpha"
    - "signal"
    - "portfolio"
    - "risk"
    - "optimization"
    - "parameter"
    - "weight"
    - "threshold"
    - "momentum"
    - "reversal"
    - "arbitrage"
    - "volatility"
    - "correlation"
    - "regime"
    - "stop loss"
    - "take profit"
    - "drawdown"
    - "sharpe"
    - "calmar"
    - "sortino"
    - "market"
    - "analysis"
    - "strategy"
    - "indicator"
    - "financial"
    - "model"
    - "forecast"
    - "prediction"

  l2_keywords:
    - "research"
    - "paper"
    - "discussion"
    - "blog"
    - "tutorial"
    - "overview"
    - "news"
    - "guide"
    - "introduction"
    - "summary"
    - "review"
    - "data"
    - "dataset"
    - "finance"
    - "economic"

  l3_keywords: []

  thresholds:
    l1_min_matches: 3
    l1_star_threshold: 500
    l2_min_matches: 2

# ============================================================
# 暂存区配置（TTL）
# ============================================================
staging:
  path: "./staging/"
  ttl_hours: 24
  max_size_mb: 100
  max_files: 100
  cleanup_interval_hours: 6

# ============================================================
# 签名配置
# ============================================================
signature:
  enabled: true
  algorithm: "HMAC-SHA256"
  key_env: "SIGNING_KEY"

# ============================================================
# 安全检查配置（通用敏感词检查，不含任何项目特有信息）
# ============================================================
security_check:
  enabled: true
  blocked_keywords:
    - "secret"
    - "password"
    - "api_key"
    - "token"
    - "credential"
    - "confidential"
    - "internal"
  blocked_patterns:
    - ".*\\.local$"
    - ".*\\.internal$"
    - ".*\\.private$"

# ============================================================
# ★ ★ ★ P0阶段新增：市场数据采集配置 ★ ★ ★
# ============================================================

# ----- 宏观数据采集 -----
macro:
  enabled: true
  frequency: "daily"
  data_sources:
    - "akshare"
    - "cache"
  indicators:
    - "GDP"
    - "CPI"
    - "PMI"
    - "社融"

# ----- 大宗商品采集 -----
commodity:
  enabled: true
  frequency: "hourly"
  symbols:
    - "CL=F"      # WTI原油
    - "GC=F"      # 黄金
    - "HG=F"      # 铜
    - "SI=F"      # 白银
    - "BZ=F"      # 布伦特原油
  data_sources:
    - "yfinance"
    - "akshare"
    - "cache"

# ----- 美股指数采集 -----
us_stock:
  enabled: true
  frequency: "daily"
  symbols:
    - "^DJI"
    - "^IXIC"
    - "^GSPC"
  data_sources:
    - "yfinance"
    - "datareader"
    - "cache"

# ----- 板块回撤采集 -----
sector:
  enabled: true
  frequency: "hourly"
  sectors:
    - "电子"
    - "计算机"
    - "通信"
    - "传媒"
    - "医药生物"
    - "食品饮料"
    - "家用电器"
    - "电力设备"
    - "汽车"
    - "国防军工"
    - "银行"
    - "非银金融"
    - "公用事业"
    - "煤炭"
    - "石油石化"
  data_sources:
    - "akshare"
    - "cache"

# ----- 北向资金采集 -----
north_flow:
  enabled: true
  frequency: "30min"
  data_sources:
    - "akshare"
    - "cache"

# ----- 汇率采集 -----
forex:
  enabled: true
  frequency: "daily"
  currencies:
    - "USD/CNY"
    - "EUR/CNY"
    - "JPY/CNY"
    - "GBP/CNY"
  data_sources:
    - "akshare"
    - "sina"
    - "cache"
