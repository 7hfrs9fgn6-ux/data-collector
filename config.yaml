# data-collector 采集配置
# 普通开源项目风格，不含任何V系统信息

# ============================================================
# 采集配置
# ============================================================
collect:
  # GitHub Trending 采集
  github:
    enabled: true
    url: "https://github.com/trending"
    frequency_minutes: 30
    languages: ["python", "javascript", "go", "rust"]
    max_items: 50

  # GitHub 搜索（量化/金融相关项目）
  github_search:
    enabled: true
    queries:
      - "quantitative trading"
      - "stock analysis"
      - "factor model"
      - "backtesting"
      - "alpha factor"
    max_items: 30

  # N-13 新闻采集
  news:
    enabled: true
    sources:
      eastmoney:
        enabled: true
        timeout: 10
        max_articles: 30
      tianxing:
        enabled: true
        api_key_env: "TIANXING_API_KEY"
        timeout: 8
        max_articles: 20
        # 国内新闻接口
        domestic_url: "https://api.tianapi.com/guonei/index"
        # 国际新闻接口
        international_url: "https://api.tianapi.com/world/index"
      newsapi:
        enabled: true
        api_key_env: "NEWSAPI_API_KEY"
        timeout: 8
        max_articles: 20
        query: "finance OR stock OR market OR economy"

# ============================================================
# 分级筛选配置（L1/L2/L3）
# ============================================================
classification:
  # L1：高价值信号（直接可用的优化建议）
  l1_keywords:
    - "trading"
    - "quant"
    - "backtest"
    - "factor"
    - "alpha"
    - "signal"
    - "portfolio"
    - "risk"
    - "optimization"
    - "parameter"
    - "weight"
    - "threshold"
    - "momentum"
    - "reversal"
    - "arbitrage"
    - "volatility"
    - "correlation"
    - "regime"
    - "stop loss"
    - "take profit"
    - "drawdown"
    - "sharpe"
    - "calmar"
    - "sortino"
    - "market"
    - "analysis"
    - "strategy"
    - "indicator"
    - "financial"
    - "model"
    - "forecast"
    - "prediction"

  # L2：中等价值线索
  l2_keywords:
    - "research"
    - "paper"
    - "discussion"
    - "blog"
    - "tutorial"
    - "overview"
    - "news"
    - "guide"
    - "introduction"
    - "summary"
    - "review"
    - "data"
    - "dataset"
    - "finance"
    - "economic"

  # 分级阈值
  thresholds:
    l1_min_matches: 3
    l1_star_threshold: 500
    l2_min_matches: 2

# ============================================================
# 暂存区配置（TTL）
# ============================================================
staging:
  path: "./staging/"
  ttl_hours: 24
  max_size_mb: 100
  max_files: 100
  cleanup_interval_hours: 6

# ============================================================
# ★ 公开库拉取配置（供外部读取）
# ============================================================
public_repo:
  # Artifact 名称（私密库拉取时使用）
  artifact_name: "collected-data"
  # 数据包版本
  version: "3.0"
  # 拉取超时（秒）
  pull_timeout: 30
  # 签名是否启用
  signature_enabled: true
  # 签名算法
  signature_algorithm: "HMAC-SHA256"
  # 签名密钥环境变量名（公开库侧）
  signing_key_env: "SIGNING_KEY"
  # 数据包保留天数（GitHub Artifact）
  retention_days: 7

# ============================================================
# 签名配置
# ============================================================
signature:
  enabled: true
  algorithm: "HMAC-SHA256"
  key_env: "SIGNING_KEY"

# ============================================================
# 安全检查配置
# ============================================================
security_check:
  enabled: true
  blocked_keywords:
    - "v-system"
    - "vsystem"
    - "VSystem"
    - "v_system"
    - "private_repo"
    - "内网"
  blocked_patterns:
    - ".*\\.local$"
    - ".*\\.internal$"
